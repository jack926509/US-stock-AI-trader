name: Verify consolidation
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: projects/market-dashboard/package-lock.json
      - name: Install dashboard dependencies
        run: npm --prefix projects/market-dashboard ci
      - name: Test dashboard
        run: npm --prefix projects/market-dashboard test
      - name: Build dashboard
        run: npm --prefix projects/market-dashboard run build
      - name: Verify immutable baseline and tracked changes
        run: node scripts/verify-sources.mjs
      - name: Verify feature evidence
        run: node scripts/features.mjs
