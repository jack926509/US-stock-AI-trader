[project]
name = "engine"
version = "0.1.0"
description = "Python 技術指標引擎 — 拉 Alpaca OHLCV、算 MA/RSI/MACD、POST 給 Node.js API"
requires-python = ">=3.11"
dependencies = [
    "alpaca-py>=0.30.0",
    "apscheduler>=3.10.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "pandas-ta>=0.3.14b0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
